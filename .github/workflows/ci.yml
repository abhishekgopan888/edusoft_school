name: CI & FTP Deployment

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  php-ci:
    name: PHP ${{ matrix.php-version }} Lint & CI Check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, curl, json, mysqli, gd, xml, zip, pdo
          tools: composer:v2
          coverage: none

      - name: Validate Composer Files
        run: |
          composer validate --no-check-publish composer.json
          composer validate --no-check-publish api/composer.json

      - name: Cache Root Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-root-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-root-${{ matrix.php-version }}-

      - name: Install Root Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Cache API Composer Dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: ${{ runner.os }}-composer-api-${{ matrix.php-version }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-api-${{ matrix.php-version }}-

      - name: Install API Dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP Syntax Check (Lint)
        run: |
          php -r '
            $dirs = ["application", "api", "system"];
            $errors = [];
            $count = 0;
            foreach ($dirs as $dir) {
                if (!is_dir($dir)) continue;
                $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($dir));
                foreach ($it as $file) {
                    if ($file->isFile() && $file->getExtension() === "php") {
                        if (strpos($file->getPathname(), "vendor") !== false) continue;
                        $count++;
                        $code = file_get_contents($file->getPathname());
                        try {
                            token_get_all($code, TOKEN_PARSE);
                        } catch (ParseError $e) {
                            $errors[] = $file->getPathname() . ":" . $e->getLine() . " - " . $e->getMessage();
                        }
                    }
                }
            }
            echo "Successfully linted $count PHP files in application/, api/, and system/\n";
            if (!empty($errors)) {
                echo "\nSyntax Errors Found (" . count($errors) . "):\n" . implode("\n", $errors) . "\n";
                exit(1);
            }
          '

      - name: Verify Swagger Documentation Generation
        run: |
          php api/generate_swagger.php
          test -f api/swagger.json
          test -f api/swagger.yaml

  deploy:
    name: FTP Deployment
    runs-on: ubuntu-latest
    needs: php-ci
    timeout-minutes: 180

    # Deploy only after successful CI on main branch (supports push and manual trigger)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy to Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21

          local-dir: ./
          server-dir: /

          # Extended connection and transfer timeout (in milliseconds)
          timeout: 60000
          log-level: verbose

          # Deployment exclusions (CodeIgniter specific cache/logs, server database configs, uploads, backups, temp & secrets)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/api/vendor/**
            **/addons/**
            **/backend/plugins/**
            **/backend/themes/**
            **/backend/usertemplate/**
            **/backend/fullcalendar/**
            **/backend/installer_template/**
            **/application/tmp/**
            **/api/swagger-ui-extracted/**
            **/application/third_party/**
            **/api/application/third_party/**
            **/application/language/**
            **/application/libraries/PHPMailer/**
            **/application/libraries/Zend/**
            **/application/libraries/Paytm_lib/**
            **/system/**
            **/api/system/**
            **/.env*
            **/application/config/database.php
            **/api/application/config/database.php
            **/uploads/**
            **/application/logs/**
            **/application/cache/**
            **/api/application/logs/**
            **/api/application/cache/**
            **/temp/**
            **/backup/**
            **/scratch/**
            **/*.zip
            **/*.tar.gz
            **/*.sql
            **/*.sql.gz
            **/*.bak
            **/*.backup
            **/*.log
            **/error_log
            **/addons/error_log.txt
            **/debug_*.php
            **/test_*.php
            **/*firebase_notification_key*.json*
            **/README.md
